name: Linters

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on changed files
        id: precommit
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pre-commit run --from-ref "$BASE_SHA" --to-ref HEAD --show-diff-on-failure

      - name: Capture pre-commit formatting diff
        if: steps.precommit.outcome == 'failure'
        run: git diff --binary > precommit-formatting.patch

      - name: Upload pre-commit formatting diagnostics
        if: steps.precommit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: precommit-formatting-diagnostics
          path: precommit-formatting.patch
          if-no-files-found: error

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        id: semgrep
        continue-on-error: true
        run: |
          pip install semgrep
          set -o pipefail
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness 2>&1 | tee semgrep-diagnostics.log

      - name: Upload Semgrep diagnostics
        if: steps.semgrep.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-diagnostics
          path: semgrep-diagnostics.log
          if-no-files-found: error

      - name: Enforce linter results
        if: steps.precommit.outcome == 'failure' || steps.semgrep.outcome == 'failure'
        run: exit 1

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
