name: One-off EdgePay workspace formatter

on:
  push:
    branches:
      - integration/edgepay-current-consolidation-2026-08

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration/edgepay-current-consolidation-2026-08
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format workspace shell with repository Prettier version
        run: npx --yes prettier@2.7.1 --write edgepayv1/public/js/edgepay_workspace/EdgePayWorkspaceShell.vue
      - name: Commit formatter output
        run: |
          if git diff --quiet -- edgepayv1/public/js/edgepay_workspace/EdgePayWorkspaceShell.vue; then
            echo "Workspace shell is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edgepayv1/public/js/edgepay_workspace/EdgePayWorkspaceShell.vue
          git commit -m "style(edgepay): normalize workspace shell formatting"
          git push origin HEAD:integration/edgepay-current-consolidation-2026-08
