<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Secure Payment</title>
	<style>
		:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17202a;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:540px;margin:0 auto;padding:24px 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.05)}h1{font-size:24px;margin:0 0 6px}.muted{color:#667085}.amount{font-size:30px;font-weight:700;margin:20px 0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}.btn{width:100%;border:0;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px;cursor:pointer;background:#111827;color:white}.btn:disabled{opacity:.55}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#f2f4f7;font-size:13px}.error{background:#fef3f2;color:#b42318}.success{background:#ecfdf3;color:#027a48}.spinner{padding:30px;text-align:center;color:#667085}
	</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><div class="spinner">Loading payment…</div></div></div>
<script>
const app=document.getElementById('app');const q=new URLSearchParams(location.search);const slug=q.get('link');const ref=q.get('ref');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(method,args={},http='GET'){const url=new URL('/api/method/'+method,location.origin);let opts={method:http,headers:{}};if(http==='GET'){Object.entries(args).forEach(([k,v])=>v!=null&&url.searchParams.set(k,v));}else{const form=new URLSearchParams();Object.entries(args).forEach(([k,v])=>v!=null&&form.set(k,v));opts.body=form;opts.headers['Content-Type']='application/x-www-form-urlencoded;charset=UTF-8';}const r=await fetch(url,opts);const j=await r.json();if(!r.ok||j.exc)throw new Error(j.message||j._server_messages||'Request failed');return j.message;}
async function status(reference){try{const s=await api('edgepayv1.edgepay.services.payment_links.get_payment_status',{request_reference:reference});app.innerHTML=`<h1>Payment status</h1><div class="amount">${esc(s.currency)} ${esc(s.amount)}</div><div class="notice ${['Paid','Overpaid'].includes(s.status)?'success':''}"><strong>${esc(s.status)}</strong><div>Paid: ${esc(s.currency)} ${esc(s.paid_amount)} · Outstanding: ${esc(s.currency)} ${esc(s.outstanding_amount)}</div></div>`;if(!['Paid','Overpaid','Failed','Expired','Cancelled','Refunded'].includes(s.status))setTimeout(()=>status(reference),4000);}catch(e){app.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
async function load(){if(ref)return status(ref);if(!slug){app.innerHTML='<div class="notice error">Payment link is missing.</div>';return;}try{const p=await api('edgepayv1.edgepay.services.payment_links.get_payment_link',{public_slug:slug});const variable=p.amount_mode==='Customer Entered';app.innerHTML=`<h1>${esc(p.merchant_name)}</h1><div class="muted">${esc(p.title)}</div>${p.description?`<p class="muted">${esc(p.description)}</p>`:''}${!variable?`<div class="amount">${esc(p.currency)} ${esc(p.amount)}</div>`:''}<form id="payform">${variable?`<div class="field"><label>Amount (${esc(p.currency)})</label><input name="amount" type="number" step="0.01" min="${esc(p.minimum_amount||0)}" ${p.maximum_amount?`max="${esc(p.maximum_amount)}"`:''} required></div>`:''}<div class="field"><label>Name</label><input name="name" maxlength="140" required autocomplete="name"></div><div class="field"><label>Email</label><input name="email" type="email" maxlength="180" required autocomplete="email"></div><div class="field"><label>Phone</label><input name="phone" maxlength="40" autocomplete="tel"></div><button class="btn" type="submit">Continue to payment</button></form><div class="notice">Payment is confirmed only after EdgePay receives authoritative verification from the payment provider.</div>`;document.getElementById('payform').onsubmit=async(e)=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='Preparing payment…';const fd=new FormData(e.currentTarget);let sid=sessionStorage.getItem('edgepay_checkout_'+slug);if(!sid){sid=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();sessionStorage.setItem('edgepay_checkout_'+slug,sid);}try{const r=await api('edgepayv1.edgepay.services.payment_links.start_payment_link',{public_slug:slug,customer_name:fd.get('name'),customer_email:fd.get('email'),customer_phone:fd.get('phone'),amount:fd.get('amount'),checkout_session:sid},'POST');sessionStorage.setItem('edgepay_ref_'+slug,r.request_reference);if(r.checkout_url)location.href=r.checkout_url;else status(r.request_reference);}catch(err){b.disabled=false;b.textContent='Continue to payment';app.insertAdjacentHTML('beforeend',`<div class="notice error">${esc(err.message)}</div>`);}};}catch(e){app.innerHTML=`<div class="notice error">${esc(e.message)}</div>`;}}
load();
</script>
</body>
</html>
